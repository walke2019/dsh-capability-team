name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # engines.node is >=24.9; 24.x resolves to the newest 24 release, which is above that floor.
        node: ["24.x"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # client.js and the packages' shared/ copies are generated and not committed: build them before anything reads them.
      - name: Build generated files
        run: npm run build:client && npm run build:global-memory && npm run build:omni-search && npm run build:autocomplete

      # Run through npm so npm_execpath is set for scripts/pack-package.mjs.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Pack (dry run)
        shell: bash
        run: |
          for dir in . packages/omni-search packages/global-memory; do
            name=$(node -p "require('./$dir/package.json').name")
            echo "::group::npm pack --dry-run $name ($dir)"
            (cd "$dir" && npm pack --dry-run)
            echo "::endgroup::"
          done
